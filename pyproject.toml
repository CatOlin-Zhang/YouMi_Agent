[project]
name = "youmi-agent"
version = "0.1.0"
description = "YouMi Agent — 多Agent协作框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "YouMi Team" },
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
gui = [
    "streamlit>=1.30",
]
web = [
    "aiohttp>=3.9",
]
vec = [
    "sqlite-vec>=0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["youmi*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
