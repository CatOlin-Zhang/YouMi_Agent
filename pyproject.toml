[project]
name = "youmi-agent"
version = "0.2.0"
description = "YouMi 能力库 sidecar — 工具目录 / Skill 索引 / 计划记忆 / 失败经验（MCP stdio 服务）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "YouMi Team" },
]

# 只保留 sidecar 真正需要的运行时依赖：
#   pydantic — 数据模型
#   httpx    — OpenAI 兼容 Embedding 客户端
# websockets / opentelemetry / aiohttp / fastapi 等宿主侧依赖已随 DSH 迁移移除。
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
# 加速向量检索；未安装时自动降级为 JSON 向量 + Python 余弦
vec = [
    "sqlite-vec>=0.1",
]

[project.scripts]
youmi-sidecar = "youmi.mcp.stdio_server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["youmi*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
