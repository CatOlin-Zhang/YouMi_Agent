# 让 headless profile 复用 GUI 已保存的 DeepSeek 凭证。
#
# 官方 headless 默认禁用托管凭证库，API key 只认启动环境 / <cwd>/.env / $DSH_HOME/.env；
# 这三行是 dsh-headless README「Credentials」一节给出的恢复方式。
# A/B 两组都要带这份 overlay，保证对照公平。
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false

# headless 默认走 deepseek-official（API key 路由）；本机是 OAuth 登录的 deepseek-account，
# 这里改回与 GUI 一致的路线，否则报 MISSING_CREDENTIAL。
#
# reasoningEffort 合法档位 off/low/high/max（dsh-llm-deepseek index.js:462-465），
# 不配时默认 high。off 实测会把命中率拉低 8pp（模型不再比对「查询」与「变更」的差异），
# low 能把 A 组命中率拉回 100%。这里取 high 补齐第三档，作为「推理深度」维度的上界对照。
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
